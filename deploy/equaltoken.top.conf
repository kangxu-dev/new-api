server {
    server_name equaltoken.top;

    client_max_body_size 100m;
    limit_req zone=login_endpoint_by_ip burst=5 nodelay;
    limit_req_status 429;

    # Let OpenAI-compatible clients use the host as their base URL.
    location ~ ^/(chat/completions|completions|responses|models|embeddings|edits|images|audio|files|messages|moderations|rerank)(/.*)?$ {
        rewrite ^/(.*)$ /v1/$1 last;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/equaltoken.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/equaltoken.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = equaltoken.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name equaltoken.top;
    return 404; # managed by Certbot


}
